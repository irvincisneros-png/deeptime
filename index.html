<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>(function(){var t="auto";try{t=localStorage.getItem("deeptime.theme")||"auto"}catch(e){}if(t!=="light"&&t!=="dark"){try{t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}catch(e){t="dark"}}document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t})()</script>
  <title>Rock layers · DeepTime</title>
  <meta name="description" content="DeepTime: Year 8 Geological change. A 3D cliff you can build, tilt and read: lay down rock layers, bury fossils and use the law of superposition to work out which layers are older."  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect y=%220%22 width=%2216%22 height=%224%22 fill=%22%23d8b98a%22/%3E%3Crect y=%224%22 width=%2216%22 height=%224%22 fill=%22%236f747a%22/%3E%3Crect y=%228%22 width=%2216%22 height=%224%22 fill=%22%23d9d4c4%22/%3E%3Crect y=%2212%22 width=%2216%22 height=%224%22 fill=%22%23222224%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/cellscape.css" />
  <link rel="stylesheet" href="assets/css/world.css" />
  <script type="importmap">
    { "imports": { "three": "./assets/vendor/three/build/three.module.js", "three/addons/": "./assets/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="sim-shell">
    <header class="sim-header"></header>
    <main class="stage" id="stage">
      <canvas id="canvas" aria-label="Interactive 3D block of rock layers. Lay down layers, then click layers to inspect them and put them in order from oldest to youngest. The What&rsquo;s happening panel describes what the model is doing."></canvas>
      <div id="labels"></div>
      <div class="stage-overlay" id="overlay"></div>
    </main>
    <aside class="panel" id="panel"></aside>
  </div>
  <noscript>DeepTime needs JavaScript and WebGL 2.</noscript>
  <script type="module">
    // three.js r169 needs WebGL2
    const fail = (msg) => { document.getElementById("stage").insertAdjacentHTML("beforeend", `<p class="cs-nogl">${msg}</p>`); };
    let gl = false;
    try { gl = !!document.createElement("canvas").getContext("webgl2"); } catch { gl = false; }
    if (!gl) fail("DeepTime needs a browser with WebGL 2 (a recent Chrome, Edge, Firefox or Safari). Try turning on hardware acceleration.");
    else import("./assets/js/world/shell.js")
      .then((m) => m.boot({ start: "strata", root: "" }))
      .catch((e) => { console.error(e); fail("DeepTime couldn't start. Try reloading the page."); });
  </script>
</body>
</html>
